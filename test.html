<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>NovaX Edu</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Theme & Reset */
[data-theme="dark"]{--bg:#07080f;--surface:#0f1019;--surface2:#161724;--surface3:#1d1e2e;--border:#252638;--border2:#2e3050;--text:#e8eaf5;--muted:#6b7099;--muted2:#9096c0;--card-shadow:0 4px 24px rgba(0,0,0,.4);--nav-bg:rgba(7,8,15,.92);--sidebar-bg:#0f1019;--input-bg:#161724;--modal-bg:#0f1019;}
[data-theme="light"]{--bg:#f0f2fa;--surface:#ffffff;--surface2:#f4f5fb;--surface3:#eaecf8;--border:#dde0f0;--border2:#c8ccec;--text:#1a1d3a;--muted:#8890c0;--muted2:#5560a0;--card-shadow:0 4px 24px rgba(79,142,247,.08);--nav-bg:rgba(255,255,255,.92);--sidebar-bg:#ffffff;--input-bg:#f4f5fb;--modal-bg:#ffffff;}
:root{--accent:#4f8ef7;--accent2:#f7664f;--accent3:#4ff7a8;--accent4:#f7c94f;--radius:12px;--radius-lg:18px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
[data-theme="dark"] body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 15% 10%,rgba(79,142,247,.07),transparent 60%),radial-gradient(ellipse 50% 60% at 85% 85%,rgba(247,102,79,.05),transparent 60%);pointer-events:none;z-index:0}
.page{display:none;position:relative;z-index:1;min-height:100vh}
.page.active{display:block}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Navigation */
.top-nav{position:sticky;top:0;z-index:300;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;gap:.5rem;transition:background .3s}
.logo{font-size:1.3rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;white-space:nowrap}
.nav-right{display:flex;gap:.5rem;align-items:center;flex-shrink:0}

/* Theme Toggle */
.theme-toggle{width:44px;height:24px;background:var(--surface2);border:1px solid var(--border2);border-radius:100px;cursor:pointer;position:relative;transition:all .3s;flex-shrink:0}
.theme-toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:transform .3s}
[data-theme="light"] .theme-toggle::after{transform:translateX(20px);background:var(--accent4)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem 1.1rem;border-radius:8px;font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(247,102,79,.12);border:1px solid rgba(247,102,79,.3);color:var(--accent2)}
.btn-danger:hover{background:var(--accent2);color:#fff}
.btn-success{background:rgba(79,247,168,.12);border:1px solid rgba(79,247,168,.3);color:var(--accent3)}
.btn-sm{padding:.3rem .75rem;font-size:.74rem}

/* Cards & Badges */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--card-shadow)}
.card-body{padding:1.25rem}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .65rem;border-radius:100px;font-size:.68rem;font-weight:700;letter-spacing:.4px}
.badge-free{background:rgba(79,247,168,.12);color:var(--accent3);border:1px solid rgba(79,247,168,.25)}
.badge-paid{background:rgba(247,102,79,.12);color:var(--accent2);border:1px solid rgba(247,102,79,.25)}
.badge-blue{background:rgba(79,142,247,.12);color:var(--accent);border:1px solid rgba(79,142,247,.25)}
.badge-pending{background:rgba(247,201,79,.12);color:var(--accent4);border:1px solid rgba(247,201,79,.25)}

/* Forms */
.form-group{margin-bottom:1.1rem}
.form-label{display:block;font-size:.75rem;font-weight:600;color:var(--muted2);margin-bottom:.4rem;letter-spacing:.3px}
.form-input,.form-select,.form-textarea{width:100%;background:var(--input-bg);border:1px solid var(--border2);color:var(--text);padding:.65rem .9rem;border-radius:8px;font-family:inherit;font-size:.87rem;transition:all .2s;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.12)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:600;display:none;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--modal-bg);border:1px solid var(--border2);border-radius:20px;padding:1.5rem;width:100%;max-width:520px;margin:auto;position:relative;animation:modalIn .25s ease;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.modal-lg{max-width:680px}
.modal-xl{max-width:900px}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-title{font-size:1.15rem;font-weight:700;margin-bottom:1.3rem;letter-spacing:-.4px}
.modal-close{position:absolute;top:1rem;right:1rem;background:var(--surface2);border:1px solid var(--border);color:var(--muted2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{color:var(--text);border-color:var(--border2)}

/* Sidebar */
.sidebar-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
.sidebar{background:var(--sidebar-bg);border-right:1px solid var(--border);padding:1rem .75rem;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;transition:all .3s}
.sidebar-section{font-size:.65rem;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;padding:.4rem .75rem;margin:.6rem 0 .2rem}
.sidebar-item{display:flex;align-items:center;gap:.65rem;padding:.6rem .8rem;border-radius:9px;font-size:.83rem;font-weight:500;color:var(--muted2);cursor:pointer;transition:all .2s;margin-bottom:.1rem;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.sidebar-item:hover{background:var(--surface2);color:var(--text)}
.sidebar-item.active{background:rgba(79,142,247,.1);color:var(--accent);font-weight:600}
.sidebar-badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:100px;font-size:.62rem;font-weight:700;padding:.1rem .45rem;min-width:18px;text-align:center}
.main-content{padding:1.5rem;overflow-y:auto;min-width:0}

/* Mobile Sidebar */
.sidebar-toggle{display:none;background:var(--surface2);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1rem;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250}
@media(max-width:768px){
  .sidebar-layout{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-260px;top:60px;height:calc(100vh - 60px);width:240px;z-index:260;transition:left .3s}
  .sidebar.open{left:0;box-shadow:4px 0 24px rgba(0,0,0,.3)}
  .sidebar-overlay.open{display:block}
  .sidebar-toggle{display:flex}
  .main-content{padding:1rem}
}

/* Mobile Bottom Nav */
.mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:.5rem 0;z-index:400;grid-template-columns:repeat(6,1fr)} /* Increased z-index */
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.4rem .2rem;cursor:pointer;font-size:.52rem;color:var(--muted2);transition:color .2s;border:none;background:none;font-family:inherit}
.mobile-nav-item.active{color:var(--accent)}
.mobile-nav-item .mni{font-size:1.1rem}
@media(max-width:640px){
  .mobile-bottom-nav{display:grid}
  #studentPage .sidebar-layout, #teacherPage .sidebar-layout, #adminPage .sidebar-layout{padding-bottom:60px}
}

/* Grids & Stats */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
@media(max-width:640px){.g2{grid-template-columns:1fr}.g3,.g4{grid-template-columns:1fr 1fr}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem;transition:all .3s}
.stat-icon{font-size:1.6rem;margin-bottom:.6rem}
.stat-val{font-size:1.8rem;font-weight:800;letter-spacing:-1px;line-height:1}
.stat-label{font-size:.72rem;color:var(--muted2);margin-top:.25rem}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;min-width:500px}
th{background:var(--surface2);padding:.65rem .9rem;text-align:left;font-size:.72rem;font-weight:600;color:var(--muted2);letter-spacing:.4px;border-bottom:1px solid var(--border)}
td{padding:.7rem .9rem;font-size:.82rem;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(79,142,247,.03)}

/* Store Specific */
.store-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:all .3s}
.store-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:var(--card-shadow)}
.store-thumb{height:140px;background:linear-gradient(135deg,#0d1b2e,#1a2e4a);display:flex;align-items:center;justify-content:center;font-size:3rem}
.store-body{padding:1rem}
.store-price{font-size:1.2rem;font-weight:800;color:var(--accent);margin-bottom:.5rem}
.cart-badge{position:absolute;top:-5px;right:-5px;background:var(--accent2);color:#fff;width:20px;height:20px;border-radius:50%;font-size:.7rem;display:flex;align-items:center;justify-content:center;font-weight:700}

/* Tabs */
.tabs{display:flex;gap:.3rem;background:var(--surface2);border-radius:10px;padding:.3rem;flex-wrap:wrap}
.tab-btn{padding:.42rem 1rem;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted2);font-family:inherit;transition:all .2s}
.tab-btn.active{background:var(--accent);color:#fff}

/* Alert */
.alert{padding:.7rem .9rem;border-radius:8px;font-size:.82rem;margin-bottom:.9rem}
.alert-error{background:rgba(247,102,79,.1);border:1px solid rgba(247,102,79,.3);color:var(--accent2)}
.alert-success{background:rgba(79,247,168,.1);border:1px solid rgba(79,247,168,.3);color:var(--accent3)}
.alert-warning{background:rgba(247,201,79,.1);border:1px solid rgba(247,201,79,.3);color:var(--accent4)}
.alert-info{background:rgba(79,142,247,.1);border:1px solid rgba(79,142,247,.3);color:var(--accent)}

/* Misc */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{display:flex;align-items:center;justify-content:center;padding:3rem;flex-direction:column;gap:1rem;color:var(--muted2);font-size:.88rem}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;gap:.75rem;flex-wrap:wrap}
.sec-title{font-size:1.1rem;font-weight:700;letter-spacing:-.4px}
.sec-tag{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:.3rem}
.link{color:var(--accent);cursor:pointer;font-weight:600}

/* Role Selection Tabs */
.role-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;justify-content:center}
.role-tab{flex:1;max-width:150px;padding:1rem .5rem;text-align:center;border:2px solid var(--border2);border-radius:var(--radius);cursor:pointer;transition:all .3s;background:transparent;color:var(--muted2)}
.role-tab:hover{border-color:var(--accent)}
.role-tab.active{border-color:var(--accent);background:rgba(79,142,247,.1);color:var(--accent)}
.role-tab .icon{font-size:1.5rem;display:block;margin-bottom:.3rem}

/* Approval Banner */
.approval-banner{background:linear-gradient(135deg,rgba(247,201,79,.1),rgba(247,102,79,.1));border:1px solid var(--accent4);border-radius:var(--radius);padding:1.5rem;text-align:center;margin-bottom:1.5rem}
.approval-banner h3{color:var(--accent4);margin-bottom:.5rem}
</style>
</head>
<body>

<div class="toast-container" id="toastCont"></div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    <div class="modal-title">Welcome Back 👋</div>
    <div id="loginAlert"></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="li_user" placeholder="Enter email" type="email"/></div>
    <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="li_pass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <button class="btn btn-primary" style="width:100%;padding:.75rem" onclick="doLogin()">Sign In</button>
    <p style="text-align:center;margin-top:1rem;font-size:.8rem;color:var(--muted2)">No account? <span class="link" onclick="switchModal('loginModal','registerModal')">Register Free</span></p>
  </div>
</div>

<!-- REGISTER MODAL -->
<div class="modal-overlay" id="registerModal">
  <div class="modal modal-lg">
    <button class="modal-close" onclick="closeModal('registerModal')">✕</button>
    <div class="modal-title">Create Account 🚀</div>
    
    <!-- Role Selection -->
    <div id="regRoleSelection">
      <p style="text-align:center;margin-bottom:1rem;color:var(--muted2)">I am a...</p>
      <div class="role-tabs">
        <div class="role-tab active" onclick="selectRegRole('student', this)">
          <span class="icon">👨‍🎓</span> Student
        </div>
        <div class="role-tab" onclick="selectRegRole('teacher', this)">
          <span class="icon">👨‍🏫</span> Teacher
        </div>
        <div class="role-tab" onclick="selectRegRole('admin', this)">
          <span class="icon">🛡️</span> Admin
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="showRegForm()">Next →</button>
    </div>

    <!-- Dynamic Form Area -->
    <div id="regFormArea" style="display:none">
      <button class="btn btn-ghost btn-sm" onclick="backToRoleSelect()">← Back</button>
      <div id="regAlert"></div>
      <div id="regDynamicFields"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:1rem" id="regBtn" onclick="doRegister()">Create Account</button>
      <p style="text-align:center;margin-top:1rem;font-size:.8rem;color:var(--muted2)">Have account? <span class="link" onclick="switchModal('registerModal','loginModal')">Sign In</span></p>
    </div>
  </div>
</div>

<!-- GENERIC MODAL -->
<div class="modal-overlay" id="cModal">
  <div class="modal modal-lg" id="cModalBox">
    <button class="modal-close" onclick="closeModal('cModal')">✕</button>
    <div class="modal-title" id="cModalTitle"></div>
    <div id="cModalBody"></div>
  </div>
</div>

<!-- CART MODAL -->
<div class="modal-overlay" id="cartModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('cartModal')">✕</button>
    <div class="modal-title">🛒 Your Cart</div>
    <div id="cartBody"></div>
  </div>
</div>

<!-- LANDING PAGE -->
<div id="landingPage" class="page active">
  <nav class="top-nav">
    <div class="logo" onclick="goHome()">NovaX Edu</div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()"></button>
      <button class="btn btn-ghost btn-sm" onclick="openModal('loginModal')">Sign In</button>
      <button class="btn btn-primary btn-sm" onclick="openModal('registerModal')">Register</button>
    </div>
  </nav>
  <div class="main-content" style="max-width:1200px;margin:0 auto">
     <!-- Simple Hero -->
     <div style="text-align:center;padding:4rem 1rem">
       <h1 style="font-size:2.5rem;font-weight:800;margin-bottom:1rem">Learn <span style="color:var(--accent)">Korean</span> & <span style="color:var(--accent3)">Media</span></h1>
       <p style="color:var(--muted2);max-width:500px;margin:0 auto 2rem">Join thousands of students mastering new skills.</p>
       <button class="btn btn-primary btn-lg" onclick="openModal('registerModal')">Get Started</button>
     </div>
  </div>
</div>

<!-- STUDENT PORTAL -->
<div id="studentPage" class="page">
  <nav class="top-nav">
    <button class="sidebar-toggle" onclick="toggleSidebar('studentSidebar')">☰</button>
    <div class="logo">NovaX Edu</div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()"></button>
      <div style="position:relative;cursor:pointer" onclick="openModal('cartModal')">
        🛒 <span id="cartCount" class="cart-badge" style="display:none">0</span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </nav>
  <div class="sidebar-layout">
    <div class="sidebar" id="studentSidebar">
      <div class="sidebar-section">Student</div>
      <button class="sidebar-item active" onclick="sNav('dashboard',this)">🏠 Dashboard</button>
      <button class="sidebar-item" onclick="sNav('recordings',this)">🎬 Videos</button>
      <button class="sidebar-item" onclick="sNav('store',this)">🛍️ Store</button>
      <button class="sidebar-item" onclick="sNav('orders',this)">📦 My Orders</button>
      <button class="sidebar-item" onclick="sNav('profile',this)">👤 Profile</button>
    </div>
    <div class="main-content" id="sContent"></div>
  </div>
  <nav class="mobile-bottom-nav">
    <button class="mobile-nav-item active" onclick="sNav('dashboard',this,true)"><span class="mni">🏠</span>Home</button>
    <button class="mobile-nav-item" onclick="sNav('recordings',this,true)"><span class="mni">🎬</span>Vids</button>
    <button class="mobile-nav-item" onclick="sNav('store',this,true)"><span class="mni">🛍️</span>Store</button>
    <button class="mobile-nav-item" onclick="sNav('orders',this,true)"><span class="mni">📦</span>Orders</button>
    <button class="mobile-nav-item" onclick="sNav('profile',this,true)"><span class="mni">👤</span>Me</button>
  </nav>
</div>

<!-- TEACHER PORTAL -->
<div id="teacherPage" class="page">
  <nav class="top-nav">
    <button class="sidebar-toggle" onclick="toggleSidebar('teacherSidebar')">☰</button>
    <div class="logo">Teacher Panel</div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()"></button>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </nav>
  <div class="sidebar-layout">
    <div class="sidebar" id="teacherSidebar">
      <div class="sidebar-section">Teacher</div>
      <button class="sidebar-item active" onclick="tNav('dashboard',this)">🏠 Dashboard</button>
      <button class="sidebar-item" onclick="tNav('approvals',this)">⏳ Approvals <span class="sidebar-badge" id="tPendingBadge">0</span></button>
      <button class="sidebar-item" onclick="tNav('recordings',this)">🎬 Recordings</button>
      <button class="sidebar-item" onclick="tNav('live',this)">📡 Live</button>
      <button class="sidebar-item" onclick="tNav('store',this)">🛍️ Store</button>
      <button class="sidebar-item" onclick="tNav('orders',this)">🛒 Orders</button>
      <button class="sidebar-item" onclick="tNav('profile',this)">👤 Profile</button>
    </div>
    <div class="main-content" id="tContent"></div>
  </nav>
</div>

<!-- ADMIN PORTAL -->
<div id="adminPage" class="page">
  <nav class="top-nav">
    <button class="sidebar-toggle" onclick="toggleSidebar('adminSidebar')">☰</button>
    <div class="logo">Admin Panel</div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()"></button>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </nav>
  <div class="sidebar-layout">
    <div class="sidebar" id="adminSidebar">
      <div class="sidebar-section">Admin</div>
      <button class="sidebar-item active" onclick="aNav('dashboard',this)">🏠 Overview</button>
      <button class="sidebar-item" onclick="aNav('approvals',this)">⏳ Approvals <span class="sidebar-badge" id="aPendingBadge">0</span></button>
      <button class="sidebar-item" onclick="aNav('teachers',this)">👨‍🏫 Teachers</button>
      <button class="sidebar-item" onclick="aNav('store',this)">🛍️ Store</button>
      <button class="sidebar-item" onclick="aNav('orders',this)">🛒 All Orders</button>
    </div>
    <div class="main-content" id="aContent"></div>
  </div>
</div>

<script>
// ========== SUPABASE CONFIG ==========
const SUPABASE_URL = 'https://qvbfoebshouvspsoksxp.supabase.co'; // Replace
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Replace

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPA_ANON);

// ========== STATE ==========
let CU = null; // Current User Profile
let CART = [];
let SELECTED_ROLE = 'student';

// ========== UI HELPERS ==========
const $ = id => document.getElementById(id);
const g = id => ($(id)?.value || '').trim();

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${{success:'✅',error:'❌'}[type]||'ℹ️'} ${msg}`;
  $('toastCont').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
function openModal(id){ $(id).classList.add('open') }
function closeModal(id){ $(id).classList.remove('open') }
function switchModal(a,b){ closeModal(a); setTimeout(()=>openModal(b),200) }
function toggleTheme(){
  const t = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', t==='dark'?'light':'dark');
}
function toggleSidebar(id){ $(id).classList.toggle('open') }
function closeSidebar(){ document.querySelectorAll('.sidebar').forEach(s=>s.classList.remove('open')) }
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(id).classList.add('active');
}

// ========== AUTH LOGIC ==========
async function doLogin(){
  const email = g('li_user'), pass = g('li_pass');
  if(!email||!pass) return toast('Missing fields','error');
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    
    const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
    CU = profile;
    
    // Check Approval
    if(!CU.is_approved && CU.role !== 'admin'){
       showPage('studentPage'); // Or a specific pending page
       $('sContent').innerHTML = `<div class="approval-banner"><h3>⏳ Account Pending Approval</h3><p>Your account is under review. You have limited access.</p><button class="btn btn-ghost" onclick="doLogout()">Logout</button></div>`;
       return;
    }

    routeUser(CU);
    toast(`Welcome ${CU.name}!`,'success');
    closeModal('loginModal');
  } catch(e) {
    $('loginAlert').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

function routeUser(u){
  if(u.role === 'admin') showPage('adminPage');
  else if(u.role === 'teacher') showPage('teacherPage');
  else showPage('studentPage');
  
  // Trigger initial nav
  if(u.role === 'admin') aNav('dashboard');
  else if(u.role === 'teacher') tNav('dashboard');
  else sNav('dashboard');
}

async function doLogout(){
  await sb.auth.signOut();
  CU = null;
  showPage('landingPage');
}

// ========== REGISTRATION LOGIC ==========
function selectRegRole(role, el){
  SELECTED_ROLE = role;
  document.querySelectorAll('.role-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function showRegForm(){
  $('regRoleSelection').style.display = 'none';
  $('regFormArea').style.display = 'block';
  
  let html = '';
  const common = `<div class="form-row"><div class="form-group"><label>Full Name</label><input class="form-input" id="rg_name"/></div><div class="form-group"><label>Email</label><input class="form-input" id="rg_email" type="email"/></div></div><div class="form-row"><div class="form-group"><label>Password</label><input class="form-input" type="password" id="rg_pass"/></div><div class="form-group"><label>WhatsApp</label><input class="form-input" id="rg_wa"/></div></div>`;
  
  if(SELECTED_ROLE === 'student'){
    html = `<p style="color:var(--accent);margin-bottom:1rem">Student Registration</p>${common}<div class="form-row"><div class="form-group"><label>District</label><input class="form-input" id="rg_district"/></div><div class="form-group"><label>Stream</label><select class="form-select" id="rg_stream"><option>Art</option><option>Science</option><option>Commerce</option><option>Tech</option></select></div></div>`;
  } else if(SELECTED_ROLE === 'teacher'){
    html = `<p style="color:var(--accent);margin-bottom:1rem">Teacher Registration (Requires Admin Approval)</p>${common}<div class="form-group"><label>NIC</label><input class="form-input" id="rg_nic"/></div><div class="form-group"><label>Qualifications</label><input class="form-input" id="rg_qual" placeholder="BSc, MSc..."/></div><div class="form-group"><label>Subjects to Teach</label><input class="form-input" id="rg_subs" placeholder="Korean, Media..."/></div><div class="form-group"><label>Description</label><textarea class="form-input" id="rg_desc"></textarea></div><div class="form-group"><label>Bank Details</label><input class="form-input" id="rg_bank" placeholder="Bank Name, Acc No"/></div>`;
  } else {
    html = `<p style="color:var(--accent);margin-bottom:1rem">Admin Registration (Requires Current Admin Approval)</p>${common}`;
  }
  
  $('regDynamicFields').innerHTML = html;
}

function backToRoleSelect(){
  $('regRoleSelection').style.display = 'block';
  $('regFormArea').style.display = 'none';
}

async function doRegister(){
  const name = g('rg_name'), email = g('rg_email'), pass = g('rg_pass'), wa = g('rg_wa');
  if(!name || !email || !pass) return toast('Fill required fields','error');
  
  try {
    const { data: authData, error: authErr } = await sb.auth.signUp({ email, password: pass });
    if(authErr) throw authErr;
    
    const payload = { id: authData.user.id, name, email, role: SELECTED_ROLE, whatsapp: wa, is_approved: false };
    
    if(SELECTED_ROLE === 'student'){
      payload.district = g('rg_district');
      payload.stream = g('rg_stream');
      // Students are auto-approved for FREE content, but need teacher approval for paid? 
      // Or just leave is_approved false until teacher action. 
      // Logic: If is_approved false, show limited content.
    } else if(SELECTED_ROLE === 'teacher'){
      payload.nic = g('rg_nic');
      payload.qualifications = g('rg_qual');
      payload.description = g('rg_desc');
      payload.bank_details = { info: g('rg_bank') };
      // Needs Admin approval
    }
    
    await sb.from('profiles').insert(payload);
    toast('Registered! Please login.','success');
    switchModal('registerModal', 'loginModal');
    
  } catch(e) {
    $('regAlert').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

// ========== STUDENT VIEWS ==========
async function sNav(sec, el, isMob){
  closeSidebar();
  $('sContent').innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';
  const f = { 
    dashboard: sDashboard, 
    recordings: sRecordings, 
    store: sStore, 
    orders: sOrders, 
    profile: sProfile 
  }[sec] || sDashboard;
  $('sContent').innerHTML = await f();
}

async function sDashboard(){
  const myOrders = (await sb.from('orders').select('id').eq('student_id', CU.id)).data.length;
  return `<div class="sec-tag">// Dashboard</div>
  <h2 style="margin-bottom:1.5rem">Hello, ${CU.name}!</h2>
  <div class="g3">
    <div class="stat-card"><div class="stat-val">${myOrders}</div><div class="stat-label">Orders</div></div>
    <div class="stat-card"><div class="stat-val">0</div><div class="stat-label">Progress</div></div>
    <div class="stat-card"><div class="stat-val">🏆</div><div class="stat-label">Rank</div></div>
  </div>`;
}

async function sStore(){
  const { data: items } = await sb.from('store_items').select('*');
  return `<div class="sec-header"><h2>Store</h2></div>
  <div class="g3">
    ${items?.map(i=>`
      <div class="store-card">
        <div class="store-thumb">${i.category==='book'?'📕':i.category==='paper'?'📄':'🛍️'}</div>
        <div class="store-body">
          <h3 style="font-size:.9rem;margin-bottom:.3rem">${i.title}</h3>
          <p style="font-size:.75rem;color:var(--muted2);margin-bottom:.5rem">${i.description||''}</p>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="store-price">Rs. ${i.price}</span>
            <button class="btn btn-primary btn-sm" onclick="addToCart('${i.id}','${i.title}',${i.price})">Add</button>
          </div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function addToCart(id, title, price){
  CART.push({ id, title, price });
  updateCartUI();
  toast('Added to cart','success');
}

function updateCartUI(){
  const count = CART.length;
  $('cartCount').textContent = count;
  $('cartCount').style.display = count > 0 ? 'flex' : 'none';
}

function openCartModal(){
  let total = 0;
  $('cartBody').innerHTML = CART.map((c,i)=>{ total+=c.price; return `
    <div style="display:flex;justify-content:space-between;margin-bottom:.5rem;font-size:.85rem">
      <span>${c.title}</span>
      <span>Rs. ${c.price} <button onclick="removeFromCart(${i})" style="color:var(--accent2);border:none;background:none;cursor:pointer">✕</button></span>
    </div>
  `;}).join('') || '<p style="text-align:center;color:var(--muted2)">Cart empty</p>';
  
  $('cartBody').innerHTML += `
    <hr/>
    <div style="display:flex;justify-content:space-between;font-weight:700"><span>Total</span><span>Rs. ${total}</span></div>
    <div class="form-row" style="margin-top:1rem">
       <select class="form-select" id="payMethod"><option value="bank">Bank</option><option value="cod">COD</option></select>
       <button class="btn btn-success" style="flex:1" onclick="placeOrder(${total})">Order</button>
    </div>`;
  openModal('cartModal');
}

function removeFromCart(index){
  CART.splice(index,1);
  updateCartUI();
  openCartModal();
}

async function placeOrder(total){
  if(CART.length===0) return;
  try {
    await sb.from('orders').insert({
      student_id: CU.id,
      items: CART,
      total,
      payment_method: g('payMethod'),
      status: 'pending'
    });
    CART = [];
    updateCartUI();
    closeModal('cartModal');
    toast('Order placed!','success');
    sNav('orders');
  } catch(e){ toast('Error','error') }
}

async function sOrders(){
  const { data: orders } = await sb.from('orders').select('*').eq('student_id', CU.id).order('created_at', {ascending:false});
  return `<div class="sec-header"><h2>My Orders</h2></div>
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
  <tbody>${orders?.map(o=>`
    <tr>
      <td style="font-size:.7rem">${o.id.substring(0,8)}...</td>
      <td>${o.items.length}</td>
      <td>Rs. ${o.total}</td>
      <td><span class="badge badge-${o.status==='paid'?'free':'pending'}">${o.status}</span></td>
      <td style="font-size:.7rem">${new Date(o.created_at).toLocaleDateString()}</td>
    </tr>
  `).join('')}</tbody></table></div>`;
}

// ========== TEACHER VIEWS ==========
async function tNav(sec, el){
  closeSidebar();
  $('tContent').innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';
  const f = { 
    dashboard: tDashboard, 
    approvals: tApprovals, 
    recordings: tRecordings, 
    live: tLive, 
    store: manageStore, 
    orders: tOrders, 
    profile: editProfile 
  }[sec] || tDashboard;
  $('tContent').innerHTML = await f();
}

async function tDashboard(){
  const { count } = await sb.from('student_enrollments').select('*', {count:'exact'}).eq('batch_id', 'some_batch_id'); // Simplified
  return `<div class="sec-tag">// Teacher</div><h2>Teacher Dashboard</h2>`;
}

async function tApprovals(){
  // Find students enrolled in teacher's batches (simplified logic: assume teacher has batches)
  // In real app, filter by batch_id belonging to teacher
  const { data: pendings } = await sb.from('student_enrollments').select('*, profiles(name, email)').eq('status', 'pending');
  
  return `<div class="sec-header"><h2>Pending Approvals</h2></div>
  <div style="display:grid;gap:.5rem">
    ${pendings?.map(p=>`
      <div class="card" style="padding:.8rem;display:flex;justify-content:space-between;align-items:center">
        <div><strong>${p.profiles?.name}</strong><br><span style="font-size:.75rem;color:var(--muted2)">${p.profiles?.email}</span></div>
        <div style="display:flex;gap:.3rem">
          <button class="btn btn-success btn-sm" onclick="appStudent('${p.id}')">✅</button>
          <button class="btn btn-danger btn-sm" onclick="rejStudent('${p.id}')">❌</button>
        </div>
      </div>
    `).join('')}
  </div>`;
}

async function appStudent(eid){
  await sb.from('student_enrollments').update({status:'approved'}).eq('id', eid);
  toast('Approved','success');
  tNav('approvals');
}

async function tLive(){
  return `<div class="sec-header"><h2>Schedule Class</h2><button class="btn btn-primary btn-sm" onclick="openLiveModal()">+ Add</button></div>
  <div id="liveList"></div>`;
}

function openLiveModal(){
  $('cModalTitle').textContent = 'Schedule Live';
  $('cModalBody').innerHTML = `
    <div class="form-group"><label>Title</label><input class="form-input" id="lv_title"/></div>
    <div class="form-group"><label>Date</label><input class="form-input" type="date" id="lv_date"/></div>
    <div class="form-group"><label>Time</label><input class="form-input" type="time" id="lv_time"/></div> <!-- Fixed: Time Picker -->
    <div class="form-group"><label>Zoom Link</label><input class="form-input" id="lv_link"/></div>
    <button class="btn btn-primary" onclick="saveLive()">Save</button>
  `;
  openModal('cModal');
}

// ========== ADMIN VIEWS ==========
async function aNav(sec, el){
  closeSidebar();
  $('aContent').innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';
  const f = { 
    dashboard: aDash, 
    approvals: aApprovals, 
    teachers: aTeachers, 
    store: manageStore, 
    orders: aOrders 
  }[sec] || aDash;
  $('aContent').innerHTML = await f();
}

async function aApprovals(){
  // Teachers pending approval
  const { data: pendings } = await sb.from('profiles').select('*').eq('role', 'teacher').eq('is_approved', false);
  return `<div class="sec-header"><h2>Teacher Approvals</h2></div>
  <div style="display:grid;gap:.5rem">
    ${pendings?.map(p=>`
      <div class="card" style="padding:1rem">
        <div style="display:flex;justify-content:space-between">
          <div>
            <h3>${p.name}</h3>
            <p style="font-size:.8rem;color:var(--muted2)">${p.email} | ${p.qualifications}</p>
            <p style="font-size:.75rem;margin-top:.3rem">${p.description}</p>
          </div>
          <button class="btn btn-success btn-sm" onclick="approveTeacher('${p.id}')">Approve</button>
        </div>
      </div>
    `).join('')}
  </div>`;
}

async function approveTeacher(id){
  await sb.from('profiles').update({is_approved: true}).eq('id', id);
  toast('Teacher Approved','success');
  aNav('approvals');
}

// ========== SHARED STORE MANAGEMENT ==========
async function manageStore(){
  const { data: items } = await sb.from('store_items').select('*');
  return `<div class="sec-header"><h2>Manage Store</h2><button class="btn btn-primary btn-sm" onclick="addItemModal()">+ Add</button></div>
  <div class="table-wrap"><table><thead><tr><th>Title</th><th>Cat</th><th>Price</th><th>Action</th></tr></thead>
  <tbody>${items?.map(i=>`
    <tr>
      <td>${i.title}</td><td>${i.category}</td><td>Rs.${i.price}</td>
      <td><button class="btn btn-danger btn-sm" onclick="delItem('${i.id}')">🗑</button></td>
    </tr>
  `).join('')}</tbody></table></div>`;
}

function addItemModal(){
  $('cModalTitle').textContent = 'Add Item';
  $('cModalBody').innerHTML = `
    <div class="form-group"><label>Title</label><input class="form-input" id="it_title"/></div>
    <div class="form-row">
      <div class="form-group"><label>Category</label>
        <select class="form-select" id="it_cat"><option>book</option><option>paper</option><option>tute</option></select>
      </div>
      <div class="form-group"><label>Price</label><input class="form-input" type="number" id="it_price"/></div>
    </div>
    <div class="form-group"><label>Description</label><textarea class="form-input" id="it_desc"></textarea></div>
    <button class="btn btn-primary" onclick="saveItem()">Save</button>
  `;
  openModal('cModal');
}

async function saveItem(){
  try {
    await sb.from('store_items').insert({
      title: g('it_title'), category: g('it_cat'), price: g('it_price'), description: g('it_desc')
    });
    closeModal('cModal');
    toast('Added','success');
    tNav('store'); // or aNav('store')
  } catch(e){ toast('Error','error') }
}

async function aOrders(){
  const { data: orders } = await sb.from('orders').select('*, profiles(name, email, whatsapp)').order('created_at', {ascending:false});
  return `<div class="sec-header"><h2>All Orders</h2></div>
  <div class="table-wrap"><table><thead><tr><th>Student</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
  <tbody>${orders?.map(o=>`
    <tr>
      <td>${o.profiles?.name}<br><span style="font-size:.7rem;color:var(--muted2)">${o.profiles?.whatsapp}</span></td>
      <td>${o.items.length}</td>
      <td>Rs. ${o.total}</td>
      <td><span class="badge badge-${o.status==='paid'?'free':'pending'}">${o.status}</span></td>
      <td><button class="btn btn-ghost btn-sm" onclick="markPaid('${o.id}')">✅ Paid</button></td>
    </tr>
  `).join('')}</tbody></table></div>`;
}

async function markPaid(id){
  await sb.from('orders').update({status: 'paid'}).eq('id', id);
  aNav('orders');
}

async function editProfile(){
  return `<div class="sec-tag">// Profile</div><h2>My Profile</h2>
  <div class="card" style="max-width:500px"><div class="card-body">
    <p><strong>Name:</strong> ${CU.name}</p>
    <p><strong>Email:</strong> ${CU.email}</p>
    <p><strong>Role:</strong> ${CU.role}</p>
  </div></div>`;
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    CU = profile;
    routeUser(CU);
  }
  
  sb.auth.onAuthStateChange((e,s) => {
    if(e==='SIGNED_OUT') { CU=null; showPage('landingPage'); }
  });
});
