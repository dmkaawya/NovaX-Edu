<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>NovaX Edu</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Combined CSS for Landing & Auth */
[data-theme="dark"]{--bg:#07080f;--surface:#0f1019;--surface2:#161724;--border:#252638;--text:#e8eaf5;--muted:#6b7099;--accent:#4f8ef7;--accent3:#4ff7a8;--accent2:#f7664f;--radius:12px;--nav-bg:rgba(7,8,15,.92);}
[data-theme="light"]{--bg:#f0f2fa;--surface:#fff;--surface2:#f4f5fb;--border:#dde0f0;--text:#1a1d3a;--muted:#8890c0;--accent:#4f8ef7;--nav-bg:rgba(255,255,255,.92);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.page{display:none;min-height:100vh}.page.active{display:block}
.top-nav{position:sticky;top:0;z-index:300;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.3rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem 1.1rem;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all .2s;background:var(--surface2);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:.4rem}
.form-input,.form-select,.form-textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.65rem .9rem;border-radius:8px;font-size:.87rem;transition:all .2s;outline:none}
.form-input:focus,.form-select:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:600;display:none;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.5rem;width:100%;max-width:520px;margin:auto;position:relative}
.modal-close{position:absolute;top:1rem;right:1rem;background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-close:hover{color:var(--text)}
.hero{padding:5rem 1.5rem 3.5rem;max-width:900px;margin:0 auto;text-align:center}
.hero h1{font-size:clamp(2.2rem,6vw,4.2rem);font-weight:800;letter-spacing:-2px;margin-bottom:1rem}
.grad-text{background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:1rem;color:var(--muted);max-width:480px;margin:0 auto 2rem}
.section-wrap{max-width:1200px;margin:0 auto;padding:3rem 1.5rem}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .65rem;border-radius:100px;font-size:.68rem;font-weight:700}
.badge-free{background:rgba(79,247,168,.12);color:var(--accent3);border:1px solid rgba(79,247,168,.25)}
.role-select-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.role-card{border:2px solid var(--border);border-radius:12px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s}
.role-card:hover,.role-card.active{border-color:var(--accent);background:rgba(79,142,247,.05)}
.role-icon{font-size:2rem;margin-bottom:.5rem}
.alert{padding:.7rem .9rem;border-radius:8px;font-size:.82rem;margin-bottom:.9rem}
.alert-error{background:rgba(247,102,79,.1);border:1px solid rgba(247,102,79,.3);color:var(--accent2)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    <div class="modal-title">Welcome Back 👋</div>
    <div id="loginAlert"></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="li_user" type="email" placeholder="Enter email"/></div>
    <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="li_pass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <button class="btn btn-primary" style="width:100%;padding:.75rem" id="loginBtn" onclick="doLogin()">Sign In</button>
    <p style="text-align:center;margin-top:1rem;font-size:.8rem;color:var(--muted)">No account? <span class="link" style="color:var(--accent);cursor:pointer" onclick="switchModal('loginModal','registerModal')">Register Free</span></p>
  </div>
</div>

<!-- REGISTER MODAL (Multi-Step) -->
<div class="modal-overlay" id="registerModal">
  <div class="modal" style="max-width:640px">
    <button class="modal-close" onclick="closeModal('registerModal')">✕</button>
    <div class="modal-title">Create Account 🚀</div>
    <div id="regAlert"></div>
    
    <!-- Step 1: Role Selection -->
    <div id="regStep1">
      <p style="font-size:.9rem;margin-bottom:1rem;color:var(--muted)">I am a...</p>
      <div class="role-select-grid">
        <div class="role-card" onclick="selectRole('student')"><div class="role-icon">🎓</div><div style="font-weight:700">Student</div></div>
        <div class="role-card" onclick="selectRole('teacher')"><div class="role-icon">👨‍🏫</div><div style="font-weight:700">Teacher</div></div>
        <div class="role-card" onclick="selectRole('admin')"><div class="role-icon">🛡️</div><div style="font-weight:700">Admin</div></div>
      </div>
    </div>

    <!-- Step 2: Dynamic Form -->
    <div id="regStep2" style="display:none">
      <button class="btn btn-ghost btn-sm" onclick="backToStep1()" style="margin-bottom:1rem">← Back</button>
      <div id="dynamicRegForm"></div>
    </div>
  </div>
</div>

<!-- LANDING PAGE -->
<div id="landingPage" class="page active">
  <nav class="top-nav">
    <div class="logo">NovaX Edu</div>
    <div style="display:flex;gap:.5rem">
      <button class="btn btn-ghost btn-sm" onclick="openModal('loginModal')">Sign In</button>
      <button class="btn btn-primary btn-sm" onclick="openModal('registerModal')">Register</button>
    </div>
  </nav>
  
  <div class="hero">
    <div class="badge badge-free" style="margin-bottom:1rem">✨ Sri Lanka's Premier Learning</div>
    <h1>Master <span class="grad-text">Korean & Media</span><br/>From Anywhere.</h1>
    <p>Expert-led O/L, A/L & Professional courses. Preview free, unlock premium with enrollment.</p>
    <div style="display:flex;gap:.75rem;justify-content:center">
      <button class="btn btn-primary" style="padding:.75rem 1.8rem" onclick="openModal('registerModal')">Start Free →</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://qvbfoebshouvspsoksxp.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2YmZvZWJzaG91dnNwc29rc3hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NTQ2ODAsImV4cCI6MjA4NzUzMDY4MH0.j2ucVJpX1MP71Am6g5u3ZcRzE5psJc7LIePvdlyLoQo';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPA_ANON);

let selectedRole = null;

function openModal(id){ document.getElementById(id).classList.add('open') }
function closeModal(id){ document.getElementById(id).classList.remove('open') }
function switchModal(c,o){ closeModal(c); setTimeout(()=>openModal(o),150) }
function g(id){ return (document.getElementById(id)?.value || '').trim() }

function selectRole(role){
  selectedRole = role;
  document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
  event.currentTarget.classList.add('active');
  setTimeout(() => {
    document.getElementById('regStep1').style.display = 'none';
    document.getElementById('regStep2').style.display = 'block';
    renderRegForm(role);
  }, 200);
}

function backToStep1(){
  document.getElementById('regStep1').style.display = 'block';
  document.getElementById('regStep2').style.display = 'none';
}

function renderRegForm(role){
  const el = document.getElementById('dynamicRegForm');
  if(role === 'student'){
    el.innerHTML = `
    <div style="font-size:.8rem;font-weight:700;color:var(--accent);margin-bottom:.75rem">STUDENT DETAILS</div>
    <div class="form-row"><div class="form-group"><label class="form-label">Full Name *</label><input class="form-input" id="r_name"/></div><div class="form-group"><label class="form-label">WhatsApp *</label><input class="form-input" id="r_wa" type="tel"/></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Email *</label><input class="form-input" id="r_email" type="email"/></div><div class="form-group"><label class="form-label">Password *</label><input class="form-input" type="password" id="r_pass"/></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">NIC ID</label><input class="form-input" id="r_nic"/></div><div class="form-group"><label class="form-label">Stream</label><select class="form-select" id="r_stream"><option>Art</option><option>Commerce</option><option>Science</option><option>Tech</option></select></div></div>
    <button class="btn btn-primary" style="width:100%;margin-top:1rem" onclick="doRegister()">Register Student</button>`;
  } else if(role === 'teacher'){
    el.innerHTML = `
    <div style="font-size:.8rem;font-weight:700;color:var(--accent);margin-bottom:.75rem">TEACHER APPLICATION</div>
    <div class="form-row"><div class="form-group"><label class="form-label">Full Name *</label><input class="form-input" id="r_name"/></div><div class="form-group"><label class="form-label">Email *</label><input class="form-input" id="r_email" type="email"/></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Password *</label><input class="form-input" type="password" id="r_pass"/></div><div class="form-group"><label class="form-label">WhatsApp *</label><input class="form-input" id="r_wa" type="tel"/></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">NIC ID *</label><input class="form-input" id="r_nic"/></div><div class="form-group"><label class="form-label">Contact Number *</label><input class="form-input" id="r_contact"/></div></div>
    <div class="form-group"><label class="form-label">Address *</label><input class="form-input" id="r_addr"/></div>
    <div class="form-row"><div class="form-group"><label class="form-label">District *</label><input class="form-input" id="r_district"/></div><div class="form-group"><label class="form-label">Subjects Teaching *</label><input class="form-input" id="r_subjects" placeholder="Korean, Media"/></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Grades/Courses *</label><input class="form-input" id="r_grades" placeholder="O/L, A/L"/></div><div class="form-group"><label class="form-label">Education Level *</label><select class="form-select" id="r_edu"><option>Diploma</option><option>Degree</option><option>Masters</option></select></div></div>
    <div class="form-group"><label class="form-label">Description / Bio</label><textarea class="form-input" id="r_desc" rows="3"></textarea></div>
    <div class="form-group"><label class="form-label">Bank Details (for payouts)</label><textarea class="form-input" id="r_bank" rows="2" placeholder="Bank, Acc No, Name"></textarea></div>
    <button class="btn btn-primary" style="width:100%;margin-top:1rem" onclick="doRegister()">Submit Application</button>
    <p style="font-size:.75rem;color:var(--muted);margin-top:.5rem;text-align:center">* Your account requires Admin approval.</p>`;
  } else if(role === 'admin'){
    el.innerHTML = `
    <div style="font-size:.8rem;font-weight:700;color:var(--accent);margin-bottom:.75rem">ADMIN ACCOUNT</div>
    <div class="form-group"><label class="form-label">Full Name *</label><input class="form-input" id="r_name"/></div>
    <div class="form-group"><label class="form-label">Email *</label><input class="form-input" id="r_email" type="email"/></div>
    <div class="form-group"><label class="form-label">Password *</label><input class="form-input" type="password" id="r_pass"/></div>
    <button class="btn btn-primary" style="width:100%;margin-top:1rem" onclick="doRegister()">Register Admin</button>
    <p style="font-size:.75rem;color:var(--muted);margin-top:.5rem;text-align:center">* Requires existing Admin approval.</p>`;
  }
}

async function doRegister(){
  const btn = event.target;
  btn.innerHTML = '<span class="spinner"></span>';
  const data = {
    email: g('r_email'), password: g('r_pass'),
    options: { data: { 
      role: selectedRole, 
      name: g('r_name'), 
      whatsapp: g('r_wa'), 
      nic: g('r_nic'),
      stream: g('r_stream'),
      address: g('r_addr'),
      district: g('r_district'),
      subjects_teaching: g('r_subjects'),
      grades_teaching: g('r_grades'),
      education_level: g('r_edu'),
      description: g('r_desc'),
      bank_details: g('r_bank'),
      contact_number: g('r_contact')
    } }
  };

  try {
    const { data: res, error } = await sb.auth.signUp(data);
    if(error) throw error;
    
    // Profile trigger handles insertion.
    alert('Registration successful! Please check your email to confirm (if enabled), then login.');
    closeModal('registerModal');
    openModal('loginModal');
  } catch(e) {
    document.getElementById('regAlert').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
  btn.innerHTML = 'Submit';
}

async function doLogin(){
  const btn = document.getElementById('loginBtn');
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const { error } = await sb.auth.signInWithPassword({ email: g('li_user'), password: g('li_pass') });
    if(error) throw error;
    window.location.href = 'portal.html'; // Redirect to portal
  } catch(e) {
    document.getElementById('loginAlert').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
  btn.innerHTML = 'Sign In';
}

// Check session
(async()=>{
  const { data: { session } } = await sb.auth.getSession();
  if(session) window.location.href = 'portal.html';
})();
</script>
</body>
</html>
