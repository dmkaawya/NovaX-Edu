<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaX Edu — Learn Korean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'nx-red': '#DC2626',
                        'nx-red-light': '#EF4444',
                        'nx-red-dark': '#B91C1C',
                        'nx-blue': '#3B82F6',
                        'nx-blue-dark': '#2563EB',
                        'nx-green': '#22C55E',
                        'nx-green-dark': '#16A34A',
                    },
                    fontFamily: {
                        display: ['"Bricolage Grotesque"', 'sans-serif'],
                        body: ['"Figtree"', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --sidebar-w: 260px;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Figtree', sans-serif; margin: 0; overflow-x: hidden; }
        h1, h2, h3, h4 { font-family: 'Bricolage Grotesque', sans-serif; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #52525b; }

        /* Auth page background blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            pointer-events: none;
        }
        .blob-1 { width: 500px; height: 500px; background: #DC2626; top: -150px; left: -100px; animation: blobMove 10s ease-in-out infinite; }
        .blob-2 { width: 400px; height: 400px; background: #3B82F6; bottom: -100px; right: -80px; animation: blobMove 12s ease-in-out infinite reverse; }
        .blob-3 { width: 300px; height: 300px; background: #22C55E; top: 50%; left: 60%; animation: blobMove 8s ease-in-out infinite 2s; }
        @keyframes blobMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -30px) scale(1.08); }
            66% { transform: translate(-25px, 25px) scale(0.92); }
        }

        /* Marquee */
        .marquee-track {
            display: flex;
            width: max-content;
            animation: marqueeScroll 40s linear infinite;
        }
        .marquee-track:hover { animation-play-state: paused; }
        @keyframes marqueeScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Sidebar nav item */
        .nav-item {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.6rem 1rem; border-radius: 0.5rem;
            color: #a1a1aa; transition: all 0.15s ease;
            cursor: pointer; border-left: 3px solid transparent;
            margin-left: -3px; font-size: 0.9rem; font-weight: 500;
            user-select: none;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fafafa; }
        .dark .nav-item:hover { background: rgba(255,255,255,0.06); }
        .nav-item.active {
            background: rgba(220,38,38,0.08); color: #DC2626;
            border-left-color: #DC2626; font-weight: 600;
        }
        html:not(.dark) .nav-item { color: #71717a; }
        html:not(.dark) .nav-item:hover { background: rgba(0,0,0,0.04); color: #09090b; }
        html:not(.dark) .nav-item.active {
            background: rgba(220,38,38,0.06); color: #DC2626;
            border-left-color: #DC2626;
        }

        /* Page transition */
        .page-enter { animation: pageIn 0.25s ease-out; }
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toast */
        .toast-item {
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
        }
        .toast-item.show { transform: translateX(0); }

        /* Confirm modal */
        .modal-backdrop {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            animation: fadeIn 0.15s ease;
        }
        .modal-card { animation: modalIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* Input focus ring */
        .input-field {
            width: 100%;
            background: #f4f4f5; border: 1px solid #e4e4e7;
            border-radius: 0.5rem; padding: 0.625rem 1rem;
            font-size: 0.9rem; transition: all 0.15s ease;
            outline: none; font-family: 'Figtree', sans-serif;
        }
        .dark .input-field { background: #18181b; border-color: #27272a; color: #fafafa; }
        .input-field:focus { border-color: #DC2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.15); }
        .input-field::placeholder { color: #a1a1aa; }

        /* Korean word pulse */
        .word-pulse { animation: wordPulse 0.4s ease; }
        @keyframes wordPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Sidebar overlay (mobile) */
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 40; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

        /* Sidebar slide */
        .sidebar-panel {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media (max-width: 1023px) {
            .sidebar-panel { transform: translateX(-100%); position: fixed; z-index: 50; top: 0; bottom: 0; }
            .sidebar-panel.open { transform: translateX(0); }
        }

        /* Focus visible */
        :focus-visible { outline: 2px solid #DC2626; outline-offset: 2px; }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Role badges */
        .badge-owner { background: rgba(220,38,38,0.12); color: #DC2626; }
        .badge-admin { background: rgba(59,130,246,0.12); color: #3B82F6; }
        .badge-student { background: rgba(34,197,94,0.12); color: #22C55E; }

        /* Stat card hover */
        .stat-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .stat-card:hover { transform: translateY(-2px); }
        .dark .stat-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        html:not(.dark) .stat-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

        /* Tab switch */
        .auth-tab { transition: all 0.15s ease; }
        .auth-tab.active { background: #DC2626; color: white; }
    </style>
</head>
<body class="font-body bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-50 transition-colors duration-300 min-h-screen">

    <div id="app"></div>
    <div id="toast-container" class="fixed top-4 right-4 z-[200] flex flex-col gap-2 pointer-events-none"></div>

    <script>
    // ═══════════════════════════════════════════════════════
    // DATA & CONSTANTS
    // ═══════════════════════════════════════════════════════

    const KOREAN_WORDS = [
        { word: '안녕하세요', roman: 'Annyeonghaseyo', meaning: 'Hello (formal)', example: '안녕하세요, 저는 학생입니다.', exMeaning: 'Hello, I am a student.' },
        { word: '감사합니다', roman: 'Gamsahamnida', meaning: 'Thank you (formal)', example: '도와주셔서 감사합니다.', exMeaning: 'Thank you for helping me.' },
        { word: '사랑합니다', roman: 'Saranghamnida', meaning: 'I love you (formal)', example: '가족을 사랑합니다.', exMeaning: 'I love my family.' },
        { word: '죄송합니다', roman: 'Joesonghamnida', meaning: "I'm sorry (formal)", example: '늦어서 죄송합니다.', exMeaning: "I'm sorry for being late." },
        { word: '화이팅', roman: 'Hwaiting', meaning: 'Fighting! / You can do it!', example: '시험 화이팅!', exMeaning: 'Good luck on the exam!' },
        { word: '배고파요', roman: 'Baegopayo', meaning: "I'm hungry", example: '점심 먹으러 갈까요? 배고파요.', exMeaning: 'Shall we go eat lunch? I\'m hungry.' },
        { word: '공부', roman: 'Gongbu', meaning: 'Study', example: '매일 한국어를 공부해요.', exMeaning: 'I study Korean every day.' },
        { word: '선생님', roman: 'Seonsaengnim', meaning: 'Teacher', example: '선생님, 질문이 있어요.', exMeaning: 'Teacher, I have a question.' },
        { word: '친구', roman: 'Chingu', meaning: 'Friend', example: '친구랑 같이 놀았어요.', exMeaning: 'I hung out with my friend.' },
        { word: '행복합니다', roman: 'Haengbokhamnida', meaning: "I'm happy (formal)", example: '오늘 매우 행복합니다.', exMeaning: "I'm very happy today." },
        { word: '주세요', roman: 'Juseyo', meaning: 'Please give me', example: '물 주세요.', exMeaning: 'Water, please.' },
        { word: '재미있어요', roman: 'Jaemiisseoyo', meaning: "It's fun/interesting", example: '이 영화 재미있어요.', exMeaning: 'This movie is interesting.' },
    ];

    const DEFAULT_ANNOUNCEMENTS = [
        'Welcome to NovaX Edu — Your Korean learning journey starts here!',
        'New Live Class: "Korean Pronunciation Masterclass" this Saturday at 10 AM',
        'Quiz results for TOPIK Practice Set 3 are now available — check your scores!',
        'Flashcard feature coming soon — stay tuned!',
    ];

    const MOCK_LEADERBOARD = [
        { name: 'Kim Ji-woo', score: 2450 },
        { name: 'Park Min-jun', score: 2380 },
        { name: 'Lee Soo-yeon', score: 2250 },
        { name: 'Choi Ha-na', score: 2100 },
        { name: 'Jung Tae-hyun', score: 1980 },
    ];

    // Navigation items with role visibility
    const NAV_ITEMS = [
        { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard', roles: ['owner','admin','student'] },
        { id: 'live-classes', label: 'Live Classes', icon: 'video', roles: ['owner','admin','student'] },
        { id: 'videos', label: 'Videos', icon: 'play-circle', roles: ['owner','admin','student'] },
        { id: 'notes', label: 'Notes', icon: 'file-text', roles: ['owner','admin','student'] },
        { id: 'pdfs', label: 'PDFs', icon: 'file', roles: ['owner','admin','student'] },
        { id: 'audio', label: 'Audio Tracks', icon: 'headphones', roles: ['owner','admin','student'] },
        { id: 'quiz', label: 'Quiz', icon: 'clipboard-check', roles: ['owner','admin','student'] },
        { id: 'articles', label: 'Articles', icon: 'newspaper', roles: ['owner','admin','student'] },
        { id: 'forum', label: 'Forum', icon: 'message-square', roles: ['owner','admin','student'] },
        { id: 'divider-1', type: 'divider', roles: ['owner','admin'] },
        { id: 'pending', label: 'Pending Approvals', icon: 'clock', roles: ['owner','admin'] },
        { id: 'manage-users', label: 'Manage Users', icon: 'users', roles: ['owner'] },
    ];

    // ═══════════════════════════════════════════════════════
    // STATE MANAGEMENT
    // ═══════════════════════════════════════════════════════

    const state = {
        route: 'dashboard',
        theme: localStorage.getItem('novax_theme') || 'dark',
        sidebarOpen: false,
        authTab: 'login', // 'login' or 'register'
    };

    function applyTheme() {
        document.documentElement.classList.toggle('dark', state.theme === 'dark');
        localStorage.setItem('novax_theme', state.theme);
    }

    // ═══════════════════════════════════════════════════════
    // LOCAL STORAGE HELPERS
    // ═══════════════════════════════════════════════════════

    function getUsers() {
        try { return JSON.parse(localStorage.getItem('novax_users') || '[]'); }
        catch { return []; }
    }
    function saveUsers(users) {
        localStorage.setItem('novax_users', JSON.stringify(users));
    }
    function getAnnouncements() {
        try { return JSON.parse(localStorage.getItem('novax_announcements') || 'null') || DEFAULT_ANNOUNCEMENTS; }
        catch { return DEFAULT_ANNOUNCEMENTS; }
    }

    // ═══════════════════════════════════════════════════════
    // AUTH & USER MANAGEMENT
    // ═══════════════════════════════════════════════════════

    // SHA-256 hash via Web Crypto API (falls back to base64 on non-HTTPS)
    async function hashPassword(pwd) {
        try {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd + '_novax_salt'));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        } catch {
            return btoa(pwd + '_novax_salt');
        }
    }

    function setSession(userId) { sessionStorage.setItem('novax_sid', userId); }
    function getSession() { return sessionStorage.getItem('novax_sid'); }
    function clearSession() { sessionStorage.removeItem('novax_sid'); }

    function getCurrentUser() {
        const sid = getSession();
        if (!sid) return null;
        return getUsers().find(u => u.id === sid) || null;
    }

    function getOwner() { return getUsers().find(u => u.role === 'owner'); }

    async function registerUser(name, email, password, whatsapp) {
        const users = getUsers();
        if (users.find(u => u.email === email.toLowerCase())) {
            return { error: 'An account with this email already exists.' };
        }
        const owner = getOwner();
        const role = owner ? 'student' : 'owner';
        const hashed = await hashPassword(password);
        const user = {
            id: 'usr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
            name: name.trim(),
            email: email.toLowerCase().trim(),
            password: hashed,
            whatsapp: whatsapp.trim(),
            role,
            createdAt: new Date().toISOString(),
        };
        users.push(user);
        saveUsers(users);
        setSession(user.id);
        return { user, isNewOwner: role === 'owner' };
    }

    async function loginUser(email, password) {
        const users = getUsers();
        const hashed = await hashPassword(password);
        const user = users.find(u => u.email === email.toLowerCase().trim() && u.password === hashed);
        if (!user) return { error: 'Invalid email or password.' };
        setSession(user.id);
        return { user };
    }

    function updateUser(userId, updates) {
        const users = getUsers();
        const idx = users.findIndex(u => u.id === userId);
        if (idx === -1) return false;
        if (updates.email) {
            const dup = users.find(u => u.id !== userId && u.email === updates.email.toLowerCase());
            if (dup) return { error: 'Email already in use.' };
            updates.email = updates.email.toLowerCase().trim();
        }
        if (updates.name) updates.name = updates.name.trim();
        if (updates.whatsapp) updates.whatsapp = updates.whatsapp.trim();
        Object.assign(users[idx], updates);
        saveUsers(users);
        return true;
    }

    function deleteUser(userId) {
        const users = getUsers().filter(u => u.id !== userId);
        saveUsers(users);
        if (getSession() === userId) clearSession();
    }

    function changeUserRole(userId, newRole) {
        const users = getUsers();
        const user = users.find(u => u.id === userId);
        if (!user) return false;
        if (user.role === 'owner') return false; // Can't change owner
        user.role = newRole;
        saveUsers(users);
        return true;
    }

    // ═══════════════════════════════════════════════════════
    // UI UTILITIES
    // ═══════════════════════════════════════════════════════

    function getInitials(name) {
        return name.split(' ').filter(Boolean).map(n => n[0]).join('').toUpperCase().slice(0, 2);
    }

    function getAvatarColor(name) {
        const colors = ['#DC2626','#3B82F6','#22C55E','#A855F7','#F59E0B','#EC4899','#14B8A6','#F97316'];
        let h = 0;
        for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
        return colors[Math.abs(h) % colors.length];
    }

    function getRoleBadge(role) {
        const cls = `badge-${role}`;
        const label = role.charAt(0).toUpperCase() + role.slice(1);
        return `<span class="${cls} text-xs font-semibold px-2 py-0.5 rounded-full">${label}</span>`;
    }

    function getTodayWord() {
        const day = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
        return KOREAN_WORDS[day % KOREAN_WORDS.length];
    }

    function avatarHTML(name, size = 'w-10 h-10 text-sm') {
        const color = getAvatarColor(name);
        const initials = getInitials(name);
        return `<div class="${size} rounded-full flex items-center justify-center text-white font-bold shrink-0" style="background:${color}">${initials}</div>`;
    }

    // Toast notifications
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const colors = {
            success: 'bg-nx-green text-white',
            error: 'bg-nx-red text-white',
            info: 'bg-nx-blue text-white',
        };
        const icons = { success: 'check-circle', error: 'alert-circle', info: 'info' };
        const el = document.createElement('div');
        el.className = `toast-item ${colors[type]} px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 min-w-[280px] max-w-[400px]`;
        el.innerHTML = `<i data-lucide="${icons[type]}" class="w-5 h-5 shrink-0"></i><span class="text-sm font-medium">${message}</span>`;
        container.appendChild(el);
        lucide.createIcons({ nodes: [el] });
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
            el.classList.remove('show');
            el.addEventListener('transitionend', () => el.remove());
        }, 3500);
    }

    // Confirm modal (returns Promise)
    function showConfirm(title, message) {
        return new Promise(resolve => {
            const backdrop = document.createElement('div');
            backdrop.className = 'modal-backdrop fixed inset-0 z-[150] flex items-center justify-center p-4';
            backdrop.innerHTML = `
                <div class="modal-card bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl border border-zinc-200 dark:border-zinc-800 p-6 w-full max-w-sm">
                    <h3 class="text-lg font-display font-bold mb-2">${title}</h3>
                    <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-6">${message}</p>
                    <div class="flex gap-3 justify-end">
                        <button class="confirm-cancel px-4 py-2 rounded-lg text-sm font-medium bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors">Cancel</button>
                        <button class="confirm-ok px-4 py-2 rounded-lg text-sm font-medium bg-nx-red hover:bg-nx-red-dark text-white transition-colors">Confirm</button>
                    </div>
                </div>`;
            document.body.appendChild(backdrop);
            backdrop.querySelector('.confirm-cancel').onclick = () => { backdrop.remove(); resolve(false); };
            backdrop.querySelector('.confirm-ok').onclick = () => { backdrop.remove(); resolve(true); };
            backdrop.addEventListener('click', e => { if (e.target === backdrop) { backdrop.remove(); resolve(false); } });
        });
    }

    // ═══════════════════════════════════════════════════════
    // ROUTER
    // ═══════════════════════════════════════════════════════

    function navigate(route) {
        state.route = route;
        state.sidebarOpen = false;
        render();
    }

    // ═══════════════════════════════════════════════════════
    // COMPONENTS
    // ═══════════════════════════════════════════════════════

    function renderSidebar(user) {
        const visibleItems = NAV_ITEMS.filter(item => item.roles.includes(user.role));
        return `
        <aside class="sidebar-panel ${state.sidebarOpen ? 'open' : ''} w-[260px] h-screen bg-white dark:bg-zinc-900 border-r border-zinc-200 dark:border-zinc-800 flex flex-col shrink-0 overflow-hidden">
            <!-- Logo -->
            <div class="px-5 py-5 flex items-center gap-3 border-b border-zinc-200 dark:border-zinc-800">
                <div class="w-9 h-9 rounded-lg bg-nx-red flex items-center justify-center">
                    <span class="text-white font-display font-extrabold text-lg leading-none">N</span>
                </div>
                <div>
                    <div class="font-display font-bold text-base leading-tight">NovaX Edu</div>
                    <div class="text-[10px] text-zinc-400 font-medium tracking-wider uppercase">Learn Korean</div>
                </div>
            </div>

            <!-- Nav -->
            <nav class="flex-1 overflow-y-auto py-3 px-3" aria-label="Main navigation">
                ${visibleItems.map(item => {
                    if (item.type === 'divider') return '<div class="my-2 border-t border-zinc-200 dark:border-zinc-800"></div>';
                    const active = state.route === item.id ? 'active' : '';
                    return `<div class="nav-item ${active}" data-action="navigate" data-route="${item.id}" role="button" tabindex="0" aria-label="${item.label}">
                        <i data-lucide="${item.icon}" class="w-[18px] h-[18px] shrink-0"></i>
                        <span>${item.label}</span>
                    </div>`;
                }).join('')}
            </nav>

            <!-- Bottom: user info + actions -->
            <div class="border-t border-zinc-200 dark:border-zinc-800 p-3">
                <div class="flex items-center gap-3 px-2 py-2 mb-2">
                    ${avatarHTML(user.name, 'w-9 h-9 text-xs')}
                    <div class="min-w-0 flex-1">
                        <div class="text-sm font-semibold truncate">${user.name}</div>
                        <div class="mt-0.5">${getRoleBadge(user.role)}</div>
                    </div>
                </div>
                <div class="flex gap-1">
                    <button class="flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" data-action="toggle-theme" aria-label="Toggle theme">
                        <i data-lucide="${state.theme === 'dark' ? 'sun' : 'moon'}" class="w-4 h-4"></i>
                        <span>${state.theme === 'dark' ? 'Light' : 'Dark'}</span>
                    </button>
                    <button class="flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-nx-red hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors" data-action="logout" aria-label="Log out">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </aside>`;
    }

    function renderTopBar() {
        const announcements = getAnnouncements();
        const duplicated = [...announcements, ...announcements]; // seamless loop
        return `

                { label: 'Pending', value: 0, icon: 'clock', color: 'text-amber-500', bg: 'bg-amber-50 dark:bg-amber-950/30' },

                { label: 'Content Managed', value: 0, icon: 'layers', color: 'text-nx-green', bg: 'bg-green-50 dark:bg-green-950/30' },

                { label: 'Enrolled Courses', value: 0, icon: 'book-open', color: 'text-nx-blue', bg: 'bg-blue-50 dark:bg-blue-950/30' },
                { label: 'Quizzes Taken', value: 0, icon: 'clipboard-check', color: 'text-nx-green', bg: 'bg-green-50 dark:bg-green-950/30' },

                    <div class="flex items-center justify-between mb-3">

        <div class="grid lg:grid-cols-3 gap-4 md:gap-6">

                                <div class="text-sm text-zinc-700 dark:text-zinc-300 leading-relaxed">${word.example}</div>
                                <div class="text-xs text-zinc-400 mt-1.5 italic">${word.exMeaning}</div>

            <!-- Leaderboard -->

                <div class="flex items-center gap-2 px-5 py-3 border-b border-zinc-200 dark:border-zinc-800">
                    <i data-lucide="trophy" class="w-4 h-4 text-amber-500"></i>
                    <span class="text-sm font-semibold">Top Students</span>

                        const medal = i < 3 ? `<span class="${medalColors[i]} font-bold text-sm w-5">#${i+1}</span>` : `<span class="text-zinc-400 font-medium text-sm w-5">${i+1}</span>`;
                        return `<div class="flex items-center gap-3">
                            ${medal}
                            ${avatarHTML(s.name, 'w-8 h-8 text-xs')}

                                <div class="text-sm font-semibold truncate">${s.name}</div>
                            </div>
                            <div class="text-sm font-bold text-zinc-500 dark:text-zinc-400">${s.score.toLocaleString()}</div>
                        </div>`;
                    }).join('')}
                    <div class="pt-2 border-t border-zinc-100 dark:border-zinc-800 text-center">
                        <span class="text-xs text-zinc-400">Full leaderboard coming in Phase 6</span>

        </div>

        <!-- Quick Actions (students) -->
        ${isStudent ? `

            <div class="flex flex-wrap gap-2">
                <button class="px-4 py-2 rounded-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-sm font-medium transition-colors flex items-center gap-2" data-action="navigate" data-route="videos"><i data-lucide="play-circle" class="w-4 h-4"></i> Watch Videos</button>
                <button class="px-4 py-2 rounded-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-sm font-medium transition-colors flex items-center gap-2" data-action="navigate" data-route="quiz"><i data-lucide="clipboard-check" class="w-4 h-4"></i> Take a Quiz</button>
                <button class="px-4 py-2 rounded-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-sm font-medium transition-colors flex items-center gap-2" data-action="navigate" data-route="notes"><i data-lucide="file-text" class="w-4 h-4"></i> Read Notes</button>
                <button class="px-4 py-2 rounded-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-sm font-medium transition-colors flex items-center gap-2" data-action="navigate" data-route="live-classes"><i data-lucide="video" class="w-4 h-4"></i> Join Live Class</button>
            </div>
        </div>` : ''}

        <!-- Owner quick actions -->
        ${isOwner ? `
        <div class="mt-6 bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 p-5">
            <h3 class="text-sm font-semibold mb-3 flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 text-nx-red"></i> Owner Actions</h3>
            <div class="flex flex-wrap gap-2">
                <button class="px-4 py-2 rounded-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-sm font-medium transition-colors flex items-center gap-2" data-action="navigate" data-route="manage-users"><i data-lucide="users" class="w-4 h-4"></i> Manage Users</button>
                <button class="px-4 py-2 rounded-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-sm font-medium transition-colors flex items-center gap-2" data-action="navigate" data-route="pending"><i data-lucide="clock" class="w-4 h-4"></i> Pending Approvals</button>
            </div>
        </div>` : ''}
        `;
    }

    // --- Route resolver ---
    function renderPage(user) {
        switch (state.route) {
            case 'dashboard': return renderDashboard(user);
            case 'profile': return renderProfile(user);
            case 'manage-users': return renderManageUsers(user);
            case 'pending': return renderPending();
            case 'live-classes': return renderComingSoon('Live Classes', 'video', 'Live class scheduling with Zoom/Meet/YouTube integration arrives in Phase 2.');
            case 'videos': return renderComingSoon('Videos', 'play-circle', 'Video catalog organized by lesson, with preview and playback, arrives in Phase 2.');
            case 'notes': return renderComingSoon('Notes', 'file-text', 'Downloadable notes with student-name watermarks on PDF — Phase 2.');
            case 'pdfs': return renderComingSoon('PDFs', 'file', 'PDF resource library with watermarked downloads — Phase 2.');
            case 'audio': return renderComingSoon('Audio Tracks', 'headphones', 'Audio player with free/paid tracks — Phase 2.');
            case 'quiz': return renderComingSoon('Quiz', 'clipboard-check', 'Full quiz engine with lesson quizzes, past papers, and score analytics — Phase 6.');
            case 'articles': return renderComingSoon('Articles', 'newspaper', 'Article cards with thumbnails and full-page reading — Phase 2.');
            case 'forum': return renderComingSoon('Forum', 'message-square', 'Q&A discussion board for students — Phase 2.');
            default: return renderDashboard(user);
        }
    }

    // ═══════════════════════════════════════════════════════
    // RENDER ENGINE
    // ═══════════════════════════════════════════════════════

    function render() {
        const app = document.getElementById('app');
        const user = getCurrentUser();

        if (!user) {
            app.innerHTML = renderAuthPage();
        } else {
            // Add profile nav item dynamically
            const hasProfile = NAV_ITEMS.find(n => n.id === 'profile');
            if (!hasProfile) {
                NAV_ITEMS.splice(9, 0, { id: 'profile', label: 'My Profile', icon: 'user', roles: ['owner','admin','student'] });
            }
            app.innerHTML = renderShell(renderPage(user), user);
        }

        // Initialize Lucide icons
        lucide.createIcons();
    }

    // ═══════════════════════════════════════════════════════
    // EVENT HANDLING
    // ═══════════════════════════════════════════════════════

    function showAuthError(msg) {
        const el = document.getElementById('auth-error');
        if (!el) return;
        el.textContent = msg;
        el.classList.remove('hidden');
    }
    function hideAuthError() {
        const el = document.getElementById('auth-error');
        if (el) el.classList.add('hidden');
    }
    function showProfileError(msg) {
        const el = document.getElementById('profile-error');
        if (!el) return;
        el.textContent = msg;
        el.classList.remove('hidden');
    }
    function hideProfileError() {
        const el = document.getElementById('profile-error');
        if (el) el.classList.add('hidden');
    }

    // Delegated click handler
    document.addEventListener('click', async (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;
        const action = target.dataset.action;

        switch (action) {
            case 'switch-auth-tab':
                state.authTab = target.dataset.tab;
                hideAuthError();
                render();
                break;

            case 'toggle-sidebar':
                state.sidebarOpen = !state.sidebarOpen;
                render();
                break;

            case 'close-sidebar':
                if (state.sidebarOpen) {
                    state.sidebarOpen = false;
                    render();
                }
                break;

            case 'navigate':
                navigate(target.dataset.route);
                break;

            case 'toggle-theme':
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                applyTheme();
                render();
                break;

            case 'logout':
                clearSession();
                state.route = 'dashboard';
                state.authTab = 'login';
                render();
                showToast('Logged out successfully', 'info');
                break;

            case 'pulse-word': {
                const card = target.closest('.word-card');
                if (card) {
                    const wordEl = card.querySelector('div:first-child');
                    wordEl.classList.remove('word-pulse');
                    void wordEl.offsetWidth; // force reflow
                    wordEl.classList.add('word-pulse');
                }
                break;
            }

            case 'promote-admin': {
                const uid = target.dataset.userid;
                const confirmed = await showConfirm('Promote to Admin', 'This user will gain admin privileges including content approval and student management.');
                if (confirmed) {
                    changeUserRole(uid, 'admin');
                    render();
                    showToast('User promoted to Admin', 'success');
                }
                break;
            }

            case 'demote-admin': {
                const uid = target.dataset.userid;
                const confirmed = await showConfirm('Demote to Student', 'This user will lose all admin privileges.');
                if (confirmed) {
                    changeUserRole(uid, 'student');
                    render();
                    showToast('User demoted to Student', 'info');
                }
                break;
            }

            case 'delete-user': {
                const uid = target.dataset.userid;
                const confirmed = await showConfirm('Remove User', 'This will permanently delete this user account. This cannot be undone.');
                if (confirmed) {
                    deleteUser(uid);
                    render();
                    showToast('User removed', 'success');
                }
                break;
            }

            case 'delete-account': {
                const confirmed = await showConfirm('Delete Account', 'Are you sure you want to delete your account? All your data will be permanently lost.');
                if (confirmed) {
                    const user = getCurrentUser();
                    deleteUser(user.id);
                    state.route = 'dashboard';
                    state.authTab = 'login';
                    render();
                    showToast('Account deleted', 'info');
                }
                break;
            }
        }
    });

    // Form submission handler
    document.addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;

        if (form.id === 'login-form') {
            hideAuthError();
            const email = form.email.value.trim();
            const password = form.password.value;
            if (!email || !password) { showAuthError('Please fill in all fields.'); return; }
            const result = await loginUser(email, password);
            if (result.error) { showAuthError(result.error); return; }
            state.route = 'dashboard';
            render();
            showToast('Welcome back!', 'success');
        }

        if (form.id === 'register-form') {
            hideAuthError();
            const name = form.name.value.trim();
            const email = form.email.value.trim();
            const password = form.password.value;
            const whatsapp = form.whatsapp.value.trim();
            if (!name || !email || !password || !whatsapp) { showAuthError('Please fill in all fields.'); return; }
            if (password.length < 6) { showAuthError('Password must be at least 6 characters.'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAuthError('Please enter a valid email address.'); return; }
            const result = await registerUser(name, email, password, whatsapp);
            if (result.error) { showAuthError(result.error); return; }
            state.route = 'dashboard';
            render();
            showToast('Account created successfully!', 'success');
            if (result.isNewOwner) {
                setTimeout(() => showToast('You have been assigned the Owner role.', 'info'), 500);
            }
        }

        if (form.id === 'profile-form') {
            hideProfileError();
            const user = getCurrentUser();
            const name = form.name.value.trim();
            const email = form.email.value.trim();
            const whatsapp = form.whatsapp.value.trim();
            if (!name || !email) { showProfileError('Name and email are required.'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showProfileError('Please enter a valid email address.'); return; }
            const result = updateUser(user.id, { name, email, whatsapp });
            if (result === true) {
                render();
                showToast('Profile updated successfully', 'success');
            } else if (result && result.error) {
                showProfileError(result.error);
            }
        }
    });

    // Keyboard: Enter on nav items
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.classList.contains('nav-item')) {
            e.target.click();
        }
    });

    // ═══════════════════════════════════════════════════════
    // INITIALIZATION
    // ═══════════════════════════════════════════════════════

    applyTheme();
    render();

    </script>
</body>
</html>
